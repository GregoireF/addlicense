name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: GoReleaser
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false

      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      # Notify downstream repos so they can publish their own release artifacts.
      # DISPATCH_TOKEN must be a PAT with public_repo scope on each target repo.
      # Set it in the addlicense repo secrets (IaC: terraform/github/secrets.tf).
      - name: Dispatch to ecosystem repos
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          VERSION:  ${{ github.ref_name }}
        run: |
          for repo in addlicense-action addlicense-npm addlicense-winget; do
            echo "Dispatching addlicense-released to GregoireF/${repo} @ ${VERSION}"
            gh api "repos/GregoireF/${repo}/dispatches" \
              --method POST \
              --field event_type=addlicense-released \
              --field "client_payload[version]=${VERSION}"
          done
