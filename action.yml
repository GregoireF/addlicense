name: addlicense
description: 'Fast, minimal license header manager — add, check, update, and remove SPDX headers'
author: 'GregoireF'

branding:
  icon: shield
  color: blue

inputs:
  args:
    description: >
      Arguments passed directly to addlicense.
      Omit to use the binary without running a command
      (useful when you want to call addlicense manually in a subsequent step).
    required: false
    default: '--check .'
  version:
    description: >
      Override the release version to download (e.g. "v0.5.0").
      Defaults to the action tag (github.action_ref).
      Set this when testing the action with uses: ./ from a branch.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Resolve platform identifiers
      id: platform
      shell: bash
      run: |
        case "${{ runner.os }}" in
          Linux)   echo "os=linux"   >> "$GITHUB_OUTPUT" ;;
          macOS)   echo "os=darwin"  >> "$GITHUB_OUTPUT" ;;
          Windows) echo "os=windows" >> "$GITHUB_OUTPUT" ;;
          *)       echo "Unsupported OS: ${{ runner.os }}" >&2; exit 1 ;;
        esac
        case "${{ runner.arch }}" in
          X64)   echo "arch=amd64" >> "$GITHUB_OUTPUT" ;;
          ARM64) echo "arch=arm64" >> "$GITHUB_OUTPUT" ;;
          *)     echo "Unsupported arch: ${{ runner.arch }}" >&2; exit 1 ;;
        esac

    - name: Download and install addlicense
      shell: bash
      env:
        VERSION_INPUT: ${{ inputs.version }}
        ACTION_REF:    ${{ github.action_ref }}
        OS:            ${{ steps.platform.outputs.os }}
        ARCH:          ${{ steps.platform.outputs.arch }}
      run: |
        VERSION="${VERSION_INPUT:-$ACTION_REF}"
        if [[ ! "$VERSION" =~ ^v[0-9] ]]; then
          echo "::error::Cannot determine release version from '${VERSION}'. Set the 'version' input explicitly." >&2
          exit 1
        fi
        dest="${RUNNER_TEMP}/addlicense-bin"
        mkdir -p "$dest"

        if [ "$OS" = "windows" ]; then
          archive="addlicense_${OS}_${ARCH}.zip"
          url="https://github.com/GregoireF/addlicense/releases/download/${VERSION}/${archive}"
          curl -sSfL "$url" -o "$dest/${archive}"
          unzip -q "$dest/${archive}" -d "$dest"
        else
          archive="addlicense_${OS}_${ARCH}.tar.gz"
          url="https://github.com/GregoireF/addlicense/releases/download/${VERSION}/${archive}"
          curl -sSfL "$url" | tar -xz -C "$dest"
        fi

        echo "$dest" >> "$GITHUB_PATH"

    - name: Run addlicense
      if: inputs.args != ''
      shell: bash
      run: addlicense ${{ inputs.args }}
