name: Generate go.sum (one-shot)

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    name: Generate go.sum
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Generate go.sum
        run: go mod tidy

      - name: Open PR
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b chore/add-go-sum
          git add go.sum
          git commit -m "chore(deps): add go.sum — enables CI cache"
          git push origin chore/add-go-sum
          gh pr create \
            --title "chore(deps): add go.sum" \
            --body "Generated by \`go mod tidy\`. Enables \`cache: true\` in \`setup-go\`." \
            --base main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
