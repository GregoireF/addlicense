name: stale

on:
  schedule:
    - cron: '0 6 * * 1'  # Every Monday at 06:00 UTC
  workflow_dispatch: {}

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: Close stale issues and PRs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@5bef64f19d7facfed25c64b8e0c685cfb2a1d47d # v9.1.0
        with:
          days-before-stale: 60
          days-before-close: 7
          days-before-pr-stale: 30
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: 'pinned,security'
          exempt-pr-labels: 'pinned,security'
          stale-issue-message: >
            This issue has been inactive for 60 days.
            It will be closed in 7 days unless there is new activity.
            Feel free to comment if this is still relevant — or reopen after closing.
          close-issue-message: >
            Closing due to inactivity. Reopen if this is still relevant.
          stale-pr-message: >
            This pull request has been inactive for 30 days.
            It will be closed in 7 days unless there is new activity.
          close-pr-message: >
            Closing due to inactivity. Reopen if this is still relevant.
