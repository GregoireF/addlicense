version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: addlicense
    main: ./cmd/addlicense
    binary: addlicense
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X 'main.version={{.Version}}' -X 'main.commit={{.ShortCommit}}' -X 'main.date={{.Date}}'

archives:
  - id: default
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^chore\\(deps\\)"
      - "^ci:"
      - "Merge pull request"
      - "Merge branch"
  groups:
    - title: "New Features"
      regexp: "^feat"
      order: 0
    - title: "Bug Fixes"
      regexp: "^fix"
      order: 1
    - title: "Documentation"
      regexp: "^docs"
      order: 2
    - title: "Other"
      order: 999

release:
  github:
    owner: GregoireF
    name: addlicense
  draft: false
  prerelease: auto

# Homebrew and Scoop: no section here. GregoireF/homebrew-tap pulls each
# stable release on its own (archives checked against checksums.txt and their
# build provenance, installs tested), and serves addlicense as a formula, not
# a cask: macOS quarantines what a cask installs, and these binaries are not
# notarized. The archive names are declared in the tap's tools.yml.
