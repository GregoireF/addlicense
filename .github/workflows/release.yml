name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: GoReleaser
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: false

      - uses: goreleaser/goreleaser-action@1a80836c5c9d9e5755a25cb59ec6f45a3b5f41a8 # v7.2.1
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      # Notify downstream repos so they can publish their own release artifacts.
      # DISPATCH_TOKEN must be a PAT with public_repo scope on each target repo.
      # Set it in the addlicense repo secrets (IaC: terraform/github/secrets.tf).
      - name: Dispatch to ecosystem repos
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          VERSION:  ${{ github.ref_name }}
        run: |
          for repo in addlicense-action addlicense-npm addlicense-winget; do
            echo "Dispatching addlicense-released to GregoireF/${repo} @ ${VERSION}"
            gh api "repos/GregoireF/${repo}/dispatches" \
              --method POST \
              --field event_type=addlicense-released \
              --field "client_payload[version]=${VERSION}"
          done
